<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopion - Product 441</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .product {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .image {
            height: 250px;
            background: #eeeeee;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
        }

        .product-id {
            color: #777;
        }
    </style>
</head>

<body>

    <div class="product">

        <div class="image">
            Product Image
        </div>

        <h1>
            Shopion Demo Product
        </h1>

        <p class="product-id">
            Product ID: 441
        </p>

        <p class="price">
            ₹1,999
        </p>

        <p>
            This is a demo product page for testing
            Android App Links.
        </p>

    </div>

</body>

</html>
